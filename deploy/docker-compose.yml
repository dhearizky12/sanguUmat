# Self-hosted stack: Postgres and the ASP.NET Core API. The React bundle is baked
# into the api image too, so the API can also serve the UI out of its wwwroot; the
# public site is normally the static build hosted separately (see README.md).
#
#   cd deploy
#   cp .env.example .env      # then fill it in
#   docker compose up -d --build
#
# All persistent state is bind-mounted under ./data, so everything the stack owns
# is visible in one folder. Note the consequence: `docker compose down -v` does
# NOT erase it — to wipe, delete ./data yourself.

name: sangu-umat-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
      # Lax is right because the SPA and the API are one origin now.
      Authentication__CookieSameSite: ${COOKIE_SAMESITE:-Lax}
      Authentication__CookieDomain: ${COOKIE_DOMAIN:-}
      # Where login and logout hand the browser back to: the public site URL,
      # including the path prefix if the app is mounted under one.
      Frontend__BaseUrl: ${PUBLIC_BASE_URL}
      # URL path prefix this app is mounted under: empty for the domain root,
      # "/sanguumat" behind a reverse proxy that strips it. Changing this needs a
      # restart, not a rebuild.
      App__BasePath: ${APP_BASE_PATH:-}
      # Nothing is cross-origin here, so this is normally empty. Set
      # EXTRA_CORS_ORIGIN in .env only to let a local `npm run dev` talk to this
      # API (e.g. http://localhost:3000).
      # The Google account that becomes Admin when it first signs in. Only applies
      # at account creation, so set it before that person's first login.
      AdminEmails__0: ${ADMIN_EMAIL:-}
      Cors__AllowedOrigins__0: ${EXTRA_CORS_ORIGIN:-}
    volumes:
      - ./data/uploads:/app/wwwroot/uploads
      - ./data/dp-keys:/root/.aspnet/DataProtection-Keys
    ports:
      # Loopback only — nothing is exposed on the LAN or the router. Put a reverse
      # proxy in front of this port to reach it from elsewhere.
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
