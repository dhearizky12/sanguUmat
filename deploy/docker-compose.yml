# Postgres for the live site. The API is not in Docker: it runs on the host as a systemd
# service (sanguumat-api.service, started by run-api.sh) and talks to this database on
# 127.0.0.1:5433. The UI is a static build hosted separately.
#
#   cd deploy
#   cp .env.example .env      # then fill it in
#   docker compose up -d db
#
# The database lives in ./data/postgres, so it is visible in one folder. Note the
# consequence: `docker compose down -v` does NOT erase it; to wipe, delete ./data yourself.

name: sangu-umat-live

services:
  db:
    container_name: sangu-umat-live
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
