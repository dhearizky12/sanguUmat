# Template for env.yaml. Copy and fill in the real values:
#
#   cp env.example.yaml env.yaml
#
# env.yaml is gitignored because it holds the Google client secret and the
# database password. Keep this template in sync when you add a new setting.
#
# ASP.NET Core maps "__" in an environment variable name to ":" in configuration,
# so these override the matching keys in appsettings.json. Array elements take a
# numeric suffix — Cors__AllowedOrigins__0 replaces index 0.

ConnectionStrings__DefaultConnection: "Host=HOST.neon.tech; Database=DBNAME; Username=USER; Password=PASSWORD; SSL Mode=VerifyFull; Channel Binding=Require;"
Authentication__Google__ClientId: "YOUR_CLIENT_ID.apps.googleusercontent.com"
Authentication__Google__ClientSecret: "YOUR_CLIENT_SECRET"
Frontend__BaseUrl: "https://your-frontend-domain"
Cors__AllowedOrigins__0: "https://your-frontend-domain"
